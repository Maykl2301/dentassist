<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family Dentists — Календар</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Manrope',sans-serif;background:#f0f4f8;color:#0f172a}
.sidebar{position:fixed;top:0;left:0;width:200px;height:100vh;background:#0f172a;display:flex;flex-direction:column;z-index:10}
.logo{padding:20px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.logo-icon{width:36px;height:36px;background:#0ea5e9;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;margin-bottom:8px}
.logo-name{font-size:13px;font-weight:800;color:#fff}
.nav{padding:12px 10px;flex:1}
.nav a{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:7px;color:rgba(255,255,255,.6);text-decoration:none;font-size:13px;font-weight:500;margin-bottom:2px;transition:all .15s}
.nav a:hover{background:rgba(255,255,255,.08);color:#fff}
.nav a.active{background:#0ea5e9;color:#fff}
.main{margin-left:200px;padding:24px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.page-title{font-size:20px;font-weight:800}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;border:none;font-family:'Manrope',sans-serif;transition:all .15s;text-decoration:none}
.btn-primary{background:#0ea5e9;color:#fff}
.btn-primary:hover{background:#0284c7}
.btn-outline{background:#fff;color:#475569;border:1.5px solid #e2e8f0}

/* Вибір лікаря */
.doctor-tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.doctor-tab{padding:7px 14px;border-radius:999px;font-size:12px;font-weight:700;cursor:pointer;border:2px solid #e2e8f0;background:#fff;color:#475569;transition:all .15s}
.doctor-tab.active{border-color:#0ea5e9;background:#e0f2fe;color:#0369a1}

/* Календар */
.cal-card{background:#fff;border-radius:14px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.08);border:1px solid #e2e8f0;margin-bottom:20px}
.cal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.cal-title{font-size:17px;font-weight:800}
.cal-nav{width:34px;height:34px;border-radius:8px;border:1.5px solid #e2e8f0;background:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.cal-nav:hover{background:#f0f4f8}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-day-name{text-align:center;font-size:11px;font-weight:700;color:#94a3b8;padding:4px 0 8px;text-transform:uppercase}
.cal-day{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;cursor:pointer;transition:all .15s;position:relative;border:2px solid transparent;min-height:44px}
.cal-day:hover:not(.empty):not(.past){transform:scale(1.05);box-shadow:0 2px 8px rgba(0,0,0,.1)}
.cal-day.empty{cursor:default;background:transparent}
.cal-day.past{opacity:.35;cursor:not-allowed}
.cal-day.today{border-color:#0ea5e9;font-weight:800}
.cal-day.free{background:#f0fdf4}
.cal-day.busy{background:#fef9c3}
.cal-day.full{background:#fee2e2;cursor:not-allowed}
.cal-day.selected{background:#0ea5e9 !important;color:#fff !important;border-color:#0ea5e9}
.cal-day.sunday{opacity:.3;cursor:not-allowed}
.day-num{font-size:14px;font-weight:700}
.day-dot{width:5px;height:5px;border-radius:50%;margin-top:2px}
.free .day-dot{background:#10b981}
.busy .day-dot{background:#f59e0b}
.full .day-dot{background:#ef4444}
.selected .day-dot{background:rgba(255,255,255,.7)}

/* Легенда */
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.legend-item{display:flex;align-items:center;gap:5px;font-size:12px;color:#475569;font-weight:600}
.legend-dot{width:10px;height:10px;border-radius:3px}

/* Форма запису */
.booking-panel{background:#fff;border-radius:14px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.08);border:1px solid #e2e8f0;display:none}
.booking-panel.open{display:block}
.booking-date-title{font-size:15px;font-weight:700;margin-bottom:16px;color:#0ea5e9}
.time-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.time-slot{padding:8px;border-radius:8px;border:1.5px solid #e2e8f0;background:#fff;font-size:13px;font-weight:700;cursor:pointer;text-align:center;transition:all .15s;font-family:'Manrope',sans-serif}
.time-slot:hover{border-color:#0ea5e9;background:#e0f2fe;color:#0369a1}
.time-slot.selected{background:#0ea5e9;color:#fff;border-color:#0ea5e9}
.time-slot.booked{background:#f1f5f9;color:#cbd5e1;cursor:not-allowed;border-color:#f1f5f9}
.fg{margin-bottom:12px}
.fg label{font-size:11px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.6px;display:block;margin-bottom:5px}
.fg input,.fg select{width:100%;padding:9px 12px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:14px;font-family:'Manrope',sans-serif;color:#0f172a;outline:none;transition:border-color .15s}
.fg input:focus,.fg select:focus{border-color:#0ea5e9}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.submit-btn{width:100%;padding:11px;background:#0ea5e9;color:#fff;border:none;border-radius:9px;font-size:15px;font-weight:700;font-family:'Manrope',sans-serif;cursor:pointer;transition:all .15s}
.submit-btn:hover{background:#0284c7}
.success-msg{background:#d1fae5;border:1px solid #6ee7b7;color:#065f46;padding:12px 16px;border-radius:9px;font-size:14px;font-weight:600;margin-bottom:16px;display:none}
.section-title{font-size:13px;font-weight:800;color:#475569;text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px}
@media(max-width:600px){.sidebar{display:none}.main{margin-left:0;padding:14px}.time-grid{grid-template-columns:repeat(3,1fr)}.form-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<aside class="sidebar">
  <div class="logo"><div class="logo-icon">🦷</div><div class="logo-name">Family Dentists</div></div>
  <nav class="nav">
    <a href="/">📊 Дашборд</a>
    <a href="/calendar" class="active">📅 Календар</a>
    <a href="/patients">👥 Пацієнти</a>
  </nav>
</aside>
<main class="main">
  <div class="topbar">
    <div class="page-title">📅 Календар записів</div>
    <a href="/" class="btn btn-outline">← Дашборд</a>
  </div>

  <!-- Вибір лікаря -->
  <div class="section-title">Лікар</div>
  <div class="doctor-tabs" id="doctor-tabs">
    {% for d in doctors %}
    <div class="doctor-tab {% if loop.first %}active{% endif %}"
         onclick="selectDoctor({{ d.id }}, this)"
         data-id="{{ d.id }}">
      {{ d.name.split()[0] }} {{ d.name.split()[1] if d.name.split()|length > 1 else '' }}
    </div>
    {% endfor %}
  </div>

  <!-- Легенда -->
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#f0fdf4;border:1.5px solid #10b981"></div> Вільно</div>
    <div class="legend-item"><div class="legend-dot" style="background:#fef9c3;border:1.5px solid #f59e0b"></div> Частково</div>
    <div class="legend-item"><div class="legend-dot" style="background:#fee2e2;border:1.5px solid #ef4444"></div> Повністю зайнято</div>
  </div>

  <!-- Календар -->
  <div class="cal-card">
    <div class="cal-header">
      <button class="cal-nav" onclick="prevMonth()">‹</button>
      <div class="cal-title" id="cal-title">Червень 2026</div>
      <button class="cal-nav" onclick="nextMonth()">›</button>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
  </div>

  <!-- Форма запису (відкривається при кліку на день) -->
  <div class="booking-panel" id="booking-panel">
    <div class="success-msg" id="success-msg">✅ Запис збережено!</div>
    <div class="booking-date-title" id="booking-date-title">📅 Запис на дату</div>

    <div class="section-title">Оберіть час</div>
    <div class="time-grid" id="time-grid"></div>

    <div class="fg">
      <label>Ім'я пацієнта</label>
      <input type="text" id="f-name" placeholder="Прізвище Ім'я По-батькові">
    </div>
    <div class="fg">
      <label>Телефон</label>
      <input type="tel" id="f-phone" placeholder="+380991234567">
    </div>
    <div class="fg">
      <label>Причина візиту</label>
      <input type="text" id="f-reason" placeholder="Консультація, лікування...">
    </div>
    <button class="submit-btn" onclick="saveAppointment()">Зберегти запис →</button>
  </div>
</main>

<script>
const ALL_SLOTS = ['09:00','09:30','10:00','10:30','11:00','11:30','12:00','12:30','14:00','14:30','15:00','15:30','16:00','16:30','17:00','17:30','18:00','18:30'];
const MONTH_NAMES = ['Січень','Лютий','Березень','Квітень','Травень','Червень','Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];
const DAY_NAMES = ['Нд','Пн','Вт','Ср','Чт','Пт','Сб'];

let calYear, calMonth, selectedDate = null, selectedTime = null, selectedDoctorId = null;
let appointmentsData = {};

// Ініціалізація
const now = new Date();
calYear = now.getFullYear();
calMonth = now.getMonth();
selectedDoctorId = parseInt(document.querySelector('.doctor-tab').dataset.id);

function selectDoctor(id, el) {
  selectedDoctorId = id;
  document.querySelectorAll('.doctor-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  selectedDate = null;
  selectedTime = null;
  document.getElementById('booking-panel').classList.remove('open');
  loadMonthData();
}

async function loadMonthData() {
  const from = `${calYear}-${String(calMonth+1).padStart(2,'0')}-01`;
  const lastDay = new Date(calYear, calMonth+1, 0).getDate();
  const to = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${lastDay}`;
  const res = await fetch(`/api/appointments?start=${from}&end=${to}`);
  const events = await res.json();
  appointmentsData = {};
  events.forEach(e => {
    const d = e.start.split('T')[0];
    if(e.extendedProps && e.extendedProps.doctor === undefined) return;
    if(!appointmentsData[d]) appointmentsData[d] = 0;
    appointmentsData[d]++;
  });
  renderCalendar();
}

function renderCalendar() {
  document.getElementById('cal-title').textContent = `${MONTH_NAMES[calMonth]} ${calYear}`;
  const grid = document.getElementById('cal-grid');
  const today = new Date(); today.setHours(0,0,0,0);

  let html = DAY_NAMES.map(d=>`<div class="cal-day-name">${d}</div>`).join('');

  const first = new Date(calYear, calMonth, 1);
  const startDay = (first.getDay() + 6) % 7;
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();

  for(let i=0;i<startDay;i++) html += `<div class="cal-day empty"></div>`;

  for(let d=1; d<=daysInMonth; d++) {
    const date = new Date(calYear, calMonth, d);
    const dateStr = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isSunday = date.getDay() === 0;
    const isPast = date < today;
    const isToday = date.getTime() === today.getTime();
    const isSelected = dateStr === selectedDate;
    const count = appointmentsData[dateStr] || 0;

    let cls = 'cal-day';
    if(isSunday) cls += ' sunday';
    else if(isPast) cls += ' past';
    else if(count >= 16) cls += ' full';
    else if(count >= 8) cls += ' busy';
    else cls += ' free';
    if(isToday) cls += ' today';
    if(isSelected) cls += ' selected';

    const clickable = !isSunday && !isPast && count < 16;
    html += `<div class="${cls}" ${clickable?`onclick="selectDate('${dateStr}')"`:''}><span class="day-num">${d}</span><div class="day-dot"></div></div>`;
  }
  grid.innerHTML = html;
}

async function selectDate(dateStr) {
  selectedDate = dateStr;
  selectedTime = null;
  renderCalendar();

  // Завантажити зайняті слоти
  const res = await fetch(`/api/appointments?start=${dateStr}&end=${dateStr}`);
  const events = await res.json();
  const booked = events.map(e => e.start.split('T')[1]?.substring(0,5)).filter(Boolean);

  // Показати форму
  const panel = document.getElementById('booking-panel');
  panel.classList.add('open');
  panel.scrollIntoView({behavior:'smooth'});

  const [y,m,d] = dateStr.split('-');
  document.getElementById('booking-date-title').textContent = `📅 Запис на ${d}.${m}.${y}`;

  const timeGrid = document.getElementById('time-grid');
  timeGrid.innerHTML = ALL_SLOTS.map(t => {
    const isBooked = booked.includes(t);
    return `<button class="time-slot ${isBooked?'booked':''}" ${isBooked?'disabled':''} onclick="selectTime('${t}', this)">${t}</button>`;
  }).join('');

  document.getElementById('success-msg').style.display = 'none';
}

function selectTime(time, el) {
  selectedTime = time;
  document.querySelectorAll('.time-slot').forEach(b=>b.classList.remove('selected'));
  el.classList.add('selected');
}

async function saveAppointment() {
  const name = document.getElementById('f-name').value.trim();
  const phone = document.getElementById('f-phone').value.trim();
  const reason = document.getElementById('f-reason').value || 'Консультація';

  if(!name){ alert("Введіть ім'я"); return; }
  if(!phone){ alert("Введіть телефон"); return; }
  if(!selectedDate){ alert("Оберіть дату"); return; }
  if(!selectedTime){ alert("Оберіть час"); return; }

  const res = await fetch('/api/appointment/new', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({full_name:name, phone, date:selectedDate, time:selectedTime, doctor_id:selectedDoctorId, reason})
  });

  if(res.ok){
    document.getElementById('success-msg').style.display = 'block';
    document.getElementById('f-name').value = '';
    document.getElementById('f-phone').value = '';
    document.getElementById('f-reason').value = '';
    selectedTime = null;
    loadMonthData();
    selectDate(selectedDate);
    setTimeout(()=>{ window.location.href='/'; }, 1500);
  } else {
    alert('Помилка збереження');
  }
}

function prevMonth(){ calMonth--; if(calMonth<0){calMonth=11;calYear--;} loadMonthData(); }
function nextMonth(){ calMonth++; if(calMonth>11){calMonth=0;calYear++;} loadMonthData(); }

loadMonthData();
</script>
</body>
</html>

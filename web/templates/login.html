<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family Dentists — Вхід</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Manrope', sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #0f172a 100%);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }

  .card {
    background: rgba(255,255,255,.04);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 20px;
    padding: 40px;
    width: 100%; max-width: 380px;
    box-shadow: 0 24px 80px rgba(0,0,0,.4);
  }

  .logo {
    text-align: center; margin-bottom: 32px;
  }

  .logo-icon {
    width: 56px; height: 56px;
    background: #0ea5e9;
    border-radius: 14px;
    font-size: 28px;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 12px;
    box-shadow: 0 8px 24px rgba(14,165,233,.3);
  }

  .logo-name {
    font-size: 20px; font-weight: 800; color: #fff;
  }

  .logo-sub {
    font-size: 13px; color: rgba(255,255,255,.4);
    margin-top: 2px;
  }

  .form-group { margin-bottom: 16px; }

  .form-label {
    display: block;
    font-size: 12px; font-weight: 700;
    color: rgba(255,255,255,.5);
    margin-bottom: 6px;
    text-transform: uppercase; letter-spacing: .6px;
  }

  .form-input {
    width: 100%;
    padding: 11px 14px;
    background: rgba(255,255,255,.07);
    border: 1.5px solid rgba(255,255,255,.1);
    border-radius: 10px;
    color: #fff;
    font-size: 14px; font-family: 'Manrope', sans-serif;
    outline: none;
    transition: border-color .2s;
  }

  .form-input:focus { border-color: #0ea5e9; }
  .form-input::placeholder { color: rgba(255,255,255,.25); }

  .error {
    background: rgba(239,68,68,.15);
    border: 1px solid rgba(239,68,68,.3);
    color: #fca5a5;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 16px;
  }

  .submit-btn {
    width: 100%;
    padding: 12px;
    background: #0ea5e9;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 15px; font-weight: 700;
    font-family: 'Manrope', sans-serif;
    cursor: pointer;
    transition: all .2s;
    margin-top: 4px;
    box-shadow: 0 4px 16px rgba(14,165,233,.3);
  }

  .submit-btn:hover {
    background: #0284c7;
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(14,165,233,.4);
  }

  .hint {
    text-align: center;
    font-size: 12px; color: rgba(255,255,255,.25);
    margin-top: 20px;
  }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">🦷</div>
    <div class="logo-name">Family Dentists</div>
    <div class="logo-sub">Панель адміністратора</div>
  </div>

  {% if error %}
  <div class="error">⚠️ {{ error }}</div>
  {% endif %}

  <form method="POST">
    <div class="form-group">
      <label class="form-label">Пароль</label>
      <input type="password" name="password" class="form-input"
             placeholder="Введіть пароль" autofocus required>
    </div>
    <button type="submit" class="submit-btn">Увійти →</button>
  </form>

  <div class="hint">Family Dentists © 2024 — Івано-Франківськ</div>
</div>
</body>
</html>
